name: Refresh contribution data

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows use UTC. Runs daily at 03:17 UTC.
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-contribution-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch GraphQL contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          GITHUB_USERNAME: SaiNagendra007
        run: |
          npm run update-data
      - name: Commit refreshed data and README graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json generated/contribution-grid.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub contribution graph"
          git push
